services:
  hna:
    image: ghcr.io/atvriders/ham-net-assistant:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3045:3000"
    volumes:
      - hna-data:/data
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      NODE_ENV: production
    # NOTE: a compose-level healthcheck OVERRIDES the image's HEALTHCHECK.
    # The image intentionally ships without wget (runtime layer kept slim),
    # so this must use node's built-in http — a wget-based test here made
    # every probe fail exec and the container report unhealthy while the
    # app was actually fine.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/themes',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  hna-data:
